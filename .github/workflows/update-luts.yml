name: Update Lookup Tables
on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:

jobs:
  download:
    name: Download LUTs (${{matrix.name}})
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: 2b5cbc63
          name: global/boot
        - slug: 4e9a232b
          name: global/ffxiv
        - slug: 6b936f08
          name: global/ex1
        - slug: f29a3eb2
          name: global/ex2
        - slug: 859d0e24
          name: global/ex3
        - slug: 1bf99b87
          name: global/ex4
        - slug: 6cfeab11
          name: global/ex5

        - slug: de199059
          name: korea/ffxiv
        - slug: 573d8c07
          name: korea/ex1
        - slug: ce34ddbd
          name: korea/ex2
        - slug: b933ed2b
          name: korea/ex3
        - slug: '27577888'
          name: korea/ex4
        - slug: 5050481e
          name: korea/ex5

        - slug: c38effbc
          name: china/ffxiv
        - slug: 77420d17
          name: china/ex1
        - slug: ee4b5cad
          name: china/ex2
        - slug: 994c6c3b
          name: china/ex3
        - slug: 0728f998
          name: china/ex4
        - slug: 702fc90e
          name: china/ex5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            luts/${{matrix.slug}}
            cluts/${{matrix.slug}}
          sparse-checkout-cone-mode: false

      - name: Download Downloader
        run: |
          wget --verbose --https-only https://github.com/WorkingRobot/ffxiv-downloader/releases/latest/download/xiv-dl-linux-x64
          curl --verbose https://api.github.com/repos/WorkingRobot/ffxiv-downloader/releases/latest |
          jq --raw-output '
            .assets[] |
            select(.name == "xiv-dl-linux-x64") |
            { hash: .digest | capture("sha256:(?<hash>[0-9a-f]+)").hash, name: .name } |
            "\(.hash)  \(.name)"
          ' |
          tee /dev/tty |
          sha256sum --check --strict --warn

      - name: Setup Executable
        run: |
          mv xiv-dl-linux-x64 xiv-dl
          chmod +x xiv-dl

      - name: Retrieve LUTs
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            ./xiv-dl --verbose lut -s "${{matrix.slug}}" -o "luts/${{matrix.slug}}" -c Brotli

      - name: Calculate CLUTs
        run: |
          ./xiv-dl --verbose --debug clut -s "${{matrix.slug}}" -b "luts/${{matrix.slug}}" -o "cluts/${{matrix.slug}}"

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Check for diff
        id: check_for_diff
        run: |
          set +x
          git diff --exit-code; echo "diff=$?" >> $GITHUB_OUTPUT

      - name: Commit Changes
        if: steps.check_for_diff.outputs.diff == '1'
        env:
          ACTOR: ${{github.actor}}
          ACTOR_ID: ${{github.actor_id}}
          NAME: ${{matrix.name}}
        run: |
          rm xiv-dl
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Update Lookups for $NAME" --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>"

      - name: Fetch, Rebase, and Push
        uses: nick-fields/retry@v4
        if: steps.check_for_diff.outputs.diff == '1'
        with:
          timeout_minutes: 2
          max_attempts: 20
          command: |
            git push origin ${{steps.extract_branch.outputs.branch}}
          new_command_on_retry: |
            git stash
            git fetch origin
            git rebase -X theirs origin/${{steps.extract_branch.outputs.branch}}
            git push origin ${{steps.extract_branch.outputs.branch}}
